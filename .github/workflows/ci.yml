name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: ./test_ecommerce.db
        run: |
          pytest tests/ -v

      - name: Run ETL smoke test
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: ./ci_ecommerce.db
        run: |
          python -m src.ecommerce_pipeline.pipeline data/samples/orders.csv

      - name: Verify SQLite database
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: ./ci_ecommerce.db
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("ci_ecommerce.db")

          assert db.exists(), "SQLite database was not created"

          conn = sqlite3.connect(db)

          tables = {
              row[0]
              for row in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }

          expected = {
              "dim_products",
              "dim_customers",
              "dim_dates",
              "fact_orders",
          }

          missing = expected - tables

          assert not missing, f"Missing tables: {missing}"

          conn.close()

          print("Database verification passed.")
          PY