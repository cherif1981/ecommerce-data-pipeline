[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-pipeline"
version = "0.1.0"
description = "Production-ready ETL pipeline for ecommerce data"
requires-python = ">=3.7"
dependencies = [
    "pandas>=1.3.0",
    "python-dotenv>=0.19.0",
    "sqlalchemy>=1.4.0",
    "pydantic>=1.10.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]