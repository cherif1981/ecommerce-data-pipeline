[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=1
    --disable-warnings
    --cov=src/ecommerce_pipeline
    --cov-report=html
    --cov-report=term

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests

# Coverage
[coverage:run]
source = src/ecommerce_pipeline
omit = 
    */tests/*
    */__init__.py
    */conftest.py
    */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
    pass
    def __repr__
    def __str__